name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check-release:
    name: Check if Release Already Exists
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      version_name: ${{ steps.check.outputs.version_name }}
      already_released: ${{ steps.check.outputs.already_released }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Tag and Check Release Status
        id: check
        run: |
          # Determine the tag to use
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Triggered by tag push - extract tag name from ref
            TAG_NAME="${{ github.ref }}"
            TAG_NAME="${TAG_NAME#refs/tags/}"
          else
            # Triggered by workflow_dispatch - get latest tag
            TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$TAG_NAME" ]; then
              echo "❌ No tags found in the repository!"
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "already_released=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          
          echo "📌 Using tag: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          # Extract version name (remove 'v' prefix)
          VERSION_NAME="${TAG_NAME#v}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          
          # Check if release already exists for this tag
          RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME"
          RELEASE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ github.token }}" \
            "$RELEASE_URL")
          
          if [ "$RELEASE_STATUS" = "200" ]; then
            echo "⚠️  Release for $TAG_NAME already exists!"
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "already_released=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No release found for $TAG_NAME, proceeding with build..."
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "already_released=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build & Release APKs
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          
          # Determine if it's a pre-release (contains alpha, beta, rc, dev, etc.)
          if echo "$VERSION_NAME" | grep -iE '(alpha|beta|rc|dev|pre)' > /dev/null; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Configure Keystore and key.properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Split APKs
        run: flutter build apk --split-per-abi --release

      - name: Prepare Release Directory and Rename APKs
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/MetroNext-Taipei-${{ env.VERSION_NAME }}-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/MetroNext-Taipei-${{ env.VERSION_NAME }}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/MetroNext-Taipei-${{ env.VERSION_NAME }}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/MetroNext-Taipei-${{ env.VERSION_NAME }}-x86_64.apk

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetroNext-Taipei-APKs
          path: release/*.apk

      - name: Generate Release Notes
        run: |
          # Extract changelog content for the current version
          CHANGELOG_CONTENT=$(awk '/## ${{ env.VERSION_NAME }}/{flag=1;next}/##/{flag=0}flag' CHANGELOG.md)
          
          # Calculate SHA-256 checksums
          SHA_UNIVERSAL=$(sha256sum release/MetroNext-Taipei-${{ env.VERSION_NAME }}-universal.apk | cut -d' ' -f1)
          SHA_ARM64=$(sha256sum release/MetroNext-Taipei-${{ env.VERSION_NAME }}-arm64-v8a.apk | cut -d' ' -f1)
          SHA_ARMEABI=$(sha256sum release/MetroNext-Taipei-${{ env.VERSION_NAME }}-armeabi-v7a.apk | cut -d' ' -f1)
          SHA_X86_64=$(sha256sum release/MetroNext-Taipei-${{ env.VERSION_NAME }}-x86_64.apk | cut -d' ' -f1)
          
          # Construct release_notes.md with escaped backticks
          cat <<EOF > release_notes.md
          <div align="center">
            <img src="https://raw.githubusercontent.com/wyrindev/metro-next-taipei/main/web/icons/favicon-96x96.png" alt="logo" width="100" height="100">
            <h1>MetroNext Taipei ${{ env.VERSION_NAME }}</h1>
          </div>

          ### 🔧 What's changed (此版本變更)

          $CHANGELOG_CONTENT

          ## 📥 Downloads (下載)

          Download the **\`MetroNext-Taipei-${{ env.VERSION_NAME }}-universal.apk\`** from the **Assets** section of this release.
          請從本頁面下方的 **Assets** 區塊下載 **\`MetroNext-Taipei-${{ env.VERSION_NAME }}-universal.apk\`** 進行安裝。

          > ⚠️ Android installation from unknown sources must be enabled.
          > ⚠️ 安裝 APK 前請先允許「未知來源」安裝。

          ## 🔐 Checksums (檔案雜湊值)

          | File name | SHA-256 |
          | :--- | :--- |
          | MetroNext-Taipei-${{ env.VERSION_NAME }}-universal.apk | $SHA_UNIVERSAL |
          | MetroNext-Taipei-${{ env.VERSION_NAME }}-arm64-v8a.apk | $SHA_ARM64 |
          | MetroNext-Taipei-${{ env.VERSION_NAME }}-armeabi-v7a.apk | $SHA_ARMEABI |
          | MetroNext-Taipei-${{ env.VERSION_NAME }}-x86_64.apk | $SHA_X86_64 |

          **Full Changelog**: https://github.com/wyrindev/metro-next-taipei/commits/${{ needs.check-release.outputs.tag_name }}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag_name }}
          files: release/*.apk
          name: Version ${{ env.VERSION_NAME }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-already-released:
    name: Notify - Already Released
    needs: check-release
    if: needs.check-release.outputs.already_released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Already Released Notice
        run: |
          echo "⏭️  Release ${{ needs.check-release.outputs.tag_name }} (v${{ needs.check-release.outputs.version_name }}) already exists!"
          echo "Skipping build and release..."
